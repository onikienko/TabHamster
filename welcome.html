<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>TabHamster</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/welcome.css">
    <script src="js/ui/theme_boot.js"></script>
</head>
<body>
<!-- Opened on install (js/background.js) and from Settings, Help. Texts come from js/welcome.js. -->
<header class="band">
    <div class="band-inner">
        <span class="band-logo" id="logo"></span>
        <h1>TabHamster</h1>
    </div>
</header>

<main class="welcome" id="welcome" hidden>
    <!-- not pinned yet: the drawing -->
    <div class="intro" id="intro">
        <h2 id="heading"></h2>
        <p class="muted" id="hidden_text"></p>
    </div>
    <!-- pinned before the page opened: no drawing -->
    <div class="pinned-title" id="pinned_title" hidden>
        <span class="check-badge" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        <h2 id="pinned_heading"></h2>
    </div>

    <figure class="drawing" id="drawing">
        <!-- a toolbar of no browser in particular: the extensions button (1), its menu, the pin next to TabHamster (2).
             .pinned on the figure: the pin filled and the TabHamster button in the toolbar -->

                <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>

        <figcaption>
            <ol class="steps">

            </ol>
            <p class="done" id="done" role="status"></p>
        </figcaption>
    </figure>

    <div class="next">
        <p id="save_text"></p>
        <p class="muted"><span id="sync_text"></span> <a href="options.html#backup" id="backup_link"></a></p>
    </div>
</main>

<script type="module" src="js/welcome.js"></script>
</body>
</html>
