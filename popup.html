<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/popup.css">
    <script src="js/ui/theme_boot.js"></script>
</head>
<body>
<header class="band">
    <span class="band-logo" id="logo"></span>
    <div class="field">
        <span class="field-icon" id="field_icon"></span>
        <span class="chip" id="chip" hidden><span id="chip_text"></span><button class="ib" id="chip_clear" type="button"></button></span>
        <label class="sr-only" for="field" id="field_label"></label>
        <input id="field" type="text" autocomplete="off" spellcheck="false" maxlength="200" autofocus/>
        <button id="clear" class="ib clear" type="button" hidden></button>
        <button id="save" class="save" type="button"></button>
    </div>
</header>

<div class="tabs" role="tablist">
    <button class="tab" id="tab_saved" role="tab" type="button" aria-controls="list" aria-selected="true"><span class="count num" id="count_saved"></span></button>
    <button class="tab" id="tab_sessions" role="tab" type="button" aria-controls="list" aria-selected="false"><span class="count num" id="count_sessions"></span></button>
</div>

<main class="list" id="list" role="tabpanel" aria-labelledby="tab_saved"></main>

<footer class="footer" id="footer"></footer>

<script src="js/storage.js"></script>
<script src="js/group_store_client.js"></script>
<script type="module" src="js/popup/main.js"></script>
</body>
</html>
